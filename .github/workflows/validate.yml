name: Validar la base de ingeniería

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Comprobaciones de documentación y workspace
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Instalar pnpm fijado
        run: npm install --global pnpm@12.18.0

      - name: Validar la base de ingeniería
        run: pnpm run verify
